[package]
name = "graphify-napi"
version = "0.6.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
graphify-core = { workspace = true }
graphify-detect = { workspace = true }
graphify-extract = { workspace = true }
graphify-build = { workspace = true }
graphify-cluster = { workspace = true }
graphify-analyze = { workspace = true }
graphify-report = { workspace = true }
graphify-query = { workspace = true }
graphify-mcp = { workspace = true }
graphify-ingest = { workspace = true }
graphify-paths = { workspace = true }
graphify-semantic = { workspace = true }
graphify-embed = { workspace = true, optional = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
petgraph = { workspace = true }
sha2 = { workspace = true }

[features]
# Local embeddings (fastembed/ONNX). Off for release targets where ONNX
# Runtime ships no prebuilt binaries (x86_64-apple-darwin) — those builds
# error clearly when --embed is requested.
default = ["embed"]
embed = ["dep:graphify-embed"]

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
