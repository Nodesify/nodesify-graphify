name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# NOTE: do NOT declare a permissions block here. Called workflows may
# downgrade but not elevate the caller's token scopes; requesting
# checks:write here makes release.yml runs fail at startup. The grant
# lives on the `ci` job in release.yml. Plain push/PR runs use the
# repo's default permissive token and need nothing.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # ttf-parser (via lopdf <- pdf-extract) is unmaintained upstream with
          # no fixed version or alternative wired into pdf-extract yet; it only
          # reads embedded font metrics, not untrusted font files. Re-evaluate
          # when pdf-extract migrates (suggested successor: skrifa).
          ignore: RUSTSEC-2026-0192
      - name: Run tests
        run: cargo test --workspace
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  cli-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: cd packages/graphify-cli && npm install --install-strategy=nested
      - name: Build native module
        env:
          NAPI_RS_CLI_VERSION: '2.18.4'
        run: cargo build --release -p graphify-napi
      - name: Copy native module
        shell: bash
        run: |
          mkdir -p packages/graphify-cli/dist
          for lib in target/release/libgraphify_napi.so target/release/libgraphify_napi.dylib target/release/graphify_napi.dll; do
            if [ -f "$lib" ]; then
              cp "$lib" packages/graphify-cli/dist/graphify.node
              break
            fi
          done
      - name: Build CLI
        run: cd packages/graphify-cli && npm run build
      - name: Run CLI tests
        run: cd packages/graphify-cli && npm test
